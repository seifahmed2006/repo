# --------------------------------------------------------------------------
# CSE382 project configuration - Milestone 1
# Single source of truth for seeds, split strategy and per-task feature lists.
# ---------------------------------------------------------------------------
seed: 42

data:
  path: data/H2.csv
  url: https://raw.githubusercontent.com/afaq-ahmad/Hotel-booking-demand-Case-Study/master/H2.csv
  expected_rows: 79330
  expected_cols: 31
  drop_duplicates: true        # exact duplicate rows removed BEFORE splitting (indirect-leakage control)
  drop_zero_guest_rows: true   # Adults + Children + Babies == 0 -> invalid booking
  max_valid_adr: 1000          # ADR above this is treated as a data-entry error (1 row: 5400)

split:
  test_size: 0.15              # final hold-out, NOT touched in Milestone 1
  val_size: 0.15               # used for model selection / preliminary metrics
  stratify_on: IsCanceled
  cv_folds: 5                  # CV is run on the TRAIN split only

# ---------------------------------------------------------------------------
# Prediction / analysis point for ALL tasks: "at the moment the booking is made"
# Only fields known at booking creation are allowed as inputs.
# ---------------------------------------------------------------------------
tasks:
  regression:
    target: ADR
    min_target: 0.0            # exclusive: ADR == 0 rows (complimentary/free stays) are not a price signal
    numeric:
      - LeadTime
      - ArrivalDateYear
      - ArrivalDateWeekNumber
      - ArrivalDateDayOfMonth
      - ArrivalWeekday
      - StaysInWeekendNights
      - StaysInWeekNights
      - TotalNights
      - Adults
      - Children
      - Babies
      - TotalGuests
      - IsRepeatedGuest
      - PreviousCancellations
      - PreviousBookingsNotCanceled
      - HasCompany
    categorical:
      - ArrivalDateMonth
      - Meal
      - Country
      - MarketSegment
      - DistributionChannel
      - ReservedRoomType
      - DepositType
      - Agent
      - CustomerType
    forbidden:                 # excluded on purpose - see leakage audit
      - IsCanceled
      - ReservationStatus
      - ReservationStatusDate
      - AssignedRoomType
      - BookingChanges
      - DaysInWaitingList
      - RequiredCarParkingSpaces
      - TotalOfSpecialRequests

  classification:
    target: IsCanceled
    numeric:
      - LeadTime
      - ArrivalDateYear
      - ArrivalDateWeekNumber
      - ArrivalDateDayOfMonth
      - ArrivalWeekday
      - StaysInWeekendNights
      - StaysInWeekNights
      - TotalNights
      - Adults
      - Children
      - Babies
      - TotalGuests
      - IsRepeatedGuest
      - PreviousCancellations
      - PreviousBookingsNotCanceled
      - HasCompany
    categorical:
      - ArrivalDateMonth
      - Meal
      - Country
      - MarketSegment
      - DistributionChannel
      - ReservedRoomType
      - DepositType
      - Agent
      - CustomerType
    forbidden:
      - ReservationStatus        # DIRECT leak: Canceled/No-Show <=> IsCanceled=1
      - ReservationStatusDate    # DIRECT leak: date the final status was set (= cancel date)
      - AssignedRoomType         # assigned at/near check-in; never meaningfully assigned for cancellations
      - BookingChanges           # accumulates after booking, until cancellation/check-in
      - DaysInWaitingList        # resolved after booking; outcome-correlated
      - RequiredCarParkingSpaces # near-zero for every canceled booking (post-booking field)
      - TotalOfSpecialRequests   # can be added after booking; outcome-correlated
      - ADR                      # final averaged rate; can be revised after booking (ablation planned in M2)

  clustering:
    numeric:
      - LeadTime
      - TotalNights
      - TotalGuests
      - ADR
      - PreviousCancellations
      - IsRepeatedGuest
    log_numeric:               # right-skewed -> log1p before scaling
      - LeadTime
      - TotalNights
      - PreviousCancellations
    categorical:
      - MarketSegment
      - DepositType
      - CustomerType
      - Meal
    adr_cap: 500               # clip ADR for distance-based clustering
    forbidden:
      - IsCanceled
      - ReservationStatus
      - ReservationStatusDate
      - AssignedRoomType
      - BookingChanges
      - DaysInWaitingList
      - RequiredCarParkingSpaces
      - TotalOfSpecialRequests
    baseline_k: 8              # sklearn default for KMeans (untuned)
    k_range: [2, 10]
    silhouette_sample: 10000

preprocessing:
  rare_category_min_frequency: 0.01   # categories rarer than 1% of TRAIN are grouped as "infrequent"
  missing_category_label: Unknown
